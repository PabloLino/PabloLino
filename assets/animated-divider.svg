<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="0.35" stop-color="#38bdf8" />
      <stop offset="0.65" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="90" y="12" width="1020" height="2" rx="1" fill="url(#line)" opacity="0.42" />
  <circle cy="13" r="3" fill="#67e8f9" filter="url(#glow)">
    <animate attributeName="cx" values="90;1110;90" dur="5.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="2.75s" repeatCount="indefinite" />
  </circle>
  <circle cy="13" r="2.5" fill="#c084fc" filter="url(#glow)">
    <animate attributeName="cx" values="1110;90;1110" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" repeatCount="indefinite" />
  </circle>
</svg>
