<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Pablo Lino</title>
  <desc id="desc">Banner animado sobre desenvolvimento de software, inteligência artificial e ciência de dados</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f">
        <animate attributeName="stop-color" values="#07111f;#10102b;#07111f" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.52" stop-color="#0c1f35">
        <animate attributeName="stop-color" values="#0c1f35;#13253c;#0c1f35" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#24114f">
        <animate attributeName="stop-color" values="#24114f;#102b4c;#24114f" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="280" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="280" fill="url(#background)" />
    <rect width="1200" height="280" fill="url(#grid)" />

    <circle cx="90" cy="48" r="180" fill="url(#glow)">
      <animate attributeName="cx" values="90;210;90" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="48;90;48" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="225" r="210" fill="url(#glow)" opacity="0.65">
      <animate attributeName="cx" values="1080;960;1080" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="225;170;225" dur="9s" repeatCount="indefinite" />
    </circle>

    <g fill="#e0f2fe">
      <circle cx="145" cy="75" r="2" opacity="0.25">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="1050" cy="72" r="2.5" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="102" cy="220" r="2.5" opacity="0.4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="1115" cy="200" r="2" opacity="0.25">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
      <text x="600" y="81" fill="#bae6fd" font-size="17" font-weight="600" letter-spacing="5" opacity="0">
        OLÁ, EU SOU
        <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" />
      </text>

      <text x="600" y="145" fill="#ffffff" font-size="58" font-weight="750" letter-spacing="2" opacity="0">
        PABLO LINO
        <animate attributeName="opacity" values="0;1" begin="0.25s" dur="0.9s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 8;0 0" begin="0.25s" dur="0.9s" fill="freeze" />
      </text>

      <rect x="425" y="162" width="350" height="3" rx="1.5" fill="url(#accent)" filter="url(#softGlow)">
        <animate attributeName="width" values="0;350" begin="0.55s" dur="1s" fill="freeze" />
        <animate attributeName="x" values="600;425" begin="0.55s" dur="1s" fill="freeze" />
      </rect>

      <text x="600" y="207" fill="#cbd5e1" font-size="19" font-weight="500" letter-spacing="1.2" opacity="0">
        DESENVOLVIMENTO DE SOFTWARE  •  INTELIGÊNCIA ARTIFICIAL  •  CIÊNCIA DE DADOS
        <animate attributeName="opacity" values="0;1" begin="0.85s" dur="1s" fill="freeze" />
      </text>
    </g>

    <path d="M0 250 C220 225 350 278 590 252 C820 226 950 266 1200 238 L1200 280 L0 280 Z" fill="#38bdf8" opacity="0.06">
      <animate attributeName="d" values="M0 250 C220 225 350 278 590 252 C820 226 950 266 1200 238 L1200 280 L0 280 Z;M0 242 C210 278 390 228 610 253 C830 278 1010 226 1200 250 L1200 280 L0 280 Z;M0 250 C220 225 350 278 590 252 C820 226 950 266 1200 238 L1200 280 L0 280 Z" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <rect x="1" y="1" width="1198" height="278" rx="21" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2" />
</svg>
